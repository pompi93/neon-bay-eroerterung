<style>/*
VOICE: Open-World-Spiel bei Sonnenuntergang – laut, neon, motivierend, aber gut lesbar.
IDEA: Eine Stadtkarte mit Missionen wie in einem Action-Spiel; das Handy „Phoni“ schickt Tipps per SMS.
PICTURE: Neon-Karte der Stadt Neon Bay mit Bezirken, Palmen und Missionsmarkern; Fotos als Missions-Banner.
COLOUR and TYPE: Nachtviolett, Sonnenuntergangs-Pink/Orange, Cyan als Akzent; Anton für Titel, DM Sans für Text (lokal eingebettet).
LAYOUT: HUD oben, Karte als Bühne, Missionsliste darunter; Quiz als zentrierte Karte, Handy rechts unten.
*/
:root{color-scheme:dark;--bg:#14062a;--bg2:#220b45;--panel:#2a0f52;--panel2:#3a1670;--ink:#fff4fb;--mut:#cdb8e6;
--pink:#ff3ea5;--orange:#ff8a3d;--yellow:#ffd23f;--cyan:#2de2e6;--green:#7CFF6B;--red:#ff4d6d;--line:rgba(255,255,255,.14)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:clip;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(255,62,165,.25),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(45,226,230,.12),transparent 60%)}
h1,h2,h3,.disp{font-family:"Anton",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em;line-height:1.05;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(3vw,14px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:.55em 1.2em;border-radius:14px;border:0;
  background:linear-gradient(135deg,var(--pink),var(--orange));color:#1a0420;font-weight:700;box-shadow:0 4px 0 #8a1659,0 0 24px rgba(255,62,165,.35);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a1659}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),#7cc8ff);box-shadow:0 4px 0 #0f6f7a,0 0 22px rgba(45,226,230,.35)}
.btn.gold{background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:0 4px 0 #8a5a00,0 0 22px rgba(255,210,63,.35)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:.35em;padding:.2em .7em;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;white-space:nowrap}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:rgba(20,6,42,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.hud .who{display:flex;align-items:center;gap:10px;margin-right:auto}
.hud .who svg{width:30px;height:44px}
.hud .nm{font-weight:700}.hud .rk{font-size:13px;color:var(--cyan)}
.hud .stat{font-weight:700}
.hud .ib{min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 12px}

/* Start */
.hero{min-height:100svh;display:grid;place-items:center;padding:24px;background-color:#2b0b4d;
  background-image:linear-gradient(180deg,rgba(20,6,42,.15) 0%,rgba(20,6,42,.55) 55%,rgba(20,6,42,.96) 100%),var(--photo),linear-gradient(180deg,#ff7a59,#ff3ea5 45%,#3b0f6b);background-size:cover;background-position:center}
.hero .card{max-width:560px;width:100%;text-align:center;background:rgba(26,8,52,.72);border:1px solid var(--line);border-radius:24px;padding:28px 22px;backdrop-filter:blur(6px)}
.logo{font-size:clamp(58px,13vw,110px);line-height:1;letter-spacing:.03em;background:linear-gradient(180deg,#fff 0%,#ffd23f 40%,#ff3ea5 75%,#b46bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #2a0a4a) drop-shadow(0 0 18px rgba(255,62,165,.6))}
.tag{font-family:"Anton",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;color:var(--cyan);letter-spacing:.06em;margin:.2em 0 1em;font-size:clamp(15px,3.5vw,20px)}
.hero p{color:var(--mut);margin:.3em 0 1em}
.field{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.field input{flex:1 1 220px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.3);padding:0 14px;font-size:17px}
.credit{font-size:12px;color:var(--mut);margin-top:14px}
.credit a{color:var(--mut)}

/* Karte */
.mapband{padding:18px 0 8px}
.maptitle{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.maptitle h1{font-size:clamp(28px,5vw,46px);color:var(--yellow);text-shadow:0 0 18px rgba(255,210,63,.35)}
.maptitle p{margin:0;color:var(--mut);max-width:520px}
.map{position:relative;border-radius:22px;overflow:hidden;border:2px solid rgba(255,62,165,.5);box-shadow:0 0 40px rgba(255,62,165,.25),inset 0 0 60px rgba(0,0,0,.4);aspect-ratio:1000/620;background:#1b0838}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.mk{cursor:pointer}
.mk:focus{outline:none}.mk:focus .ring{stroke:#fff;stroke-width:5}
.mk.locked{cursor:not-allowed;opacity:.55}
@keyframes pulse{0%{r:26;opacity:.9}100%{r:46;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:16px 0 28px}
.mcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:76px;width:100%}
.mcard .ic{font-size:26px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.mcard b{display:block}.mcard small{color:var(--mut)}
.mcard.locked{opacity:.5}
.stars{color:var(--yellow);letter-spacing:.08em;white-space:nowrap}

/* Briefing */
.banner{border-radius:22px;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;padding:22px;margin:18px 0;background-color:#2b0b4d;
  background-image:linear-gradient(180deg,rgba(20,6,42,0) 10%,rgba(20,6,42,.92) 100%),var(--photo),linear-gradient(135deg,var(--mc),#3b0f6b);background-size:cover;background-position:center;border:2px solid var(--mc)}
.banner h2{font-size:clamp(32px,6vw,56px)}
.banner .dist{font-family:"Anton",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;color:var(--mc);letter-spacing:.08em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{font-size:18px;margin-bottom:10px;color:var(--cyan)}
.goal{display:flex;gap:10px;margin:8px 0}
.mat{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px dashed var(--line);padding:6px 0;flex-wrap:wrap}
.mat input{width:22px;height:22px;accent-color:var(--pink)}
.mat a{color:var(--cyan);font-size:14px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 30px}
.lockinfo{font-size:14px;color:var(--mut)}

/* Quiz */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.qtop .mode{font-family:"Anton",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;font-size:15px;padding:.3em .8em;border-radius:10px;background:var(--mc);color:#1a0420}
.prog{display:flex;gap:5px;flex:1 1 200px}
.prog i{height:10px;flex:1;border-radius:6px;background:rgba(255,255,255,.12)}
.prog i.ok{background:var(--green)}.prog i.no{background:var(--red)}.prog i.cur{background:var(--yellow)}
.timer{font-family:"Anton",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;font-size:20px;color:var(--yellow)}.timer.low{color:var(--red)}
.hearts{font-size:22px;letter-spacing:.1em}
.qcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.qcard h2{font-family:"DM Sans",system-ui,sans-serif;font-weight:700;font-size:clamp(19px,2.6vw,24px);line-height:1.3;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:52px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.05);width:100%}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:700}
.opt.sel{border-color:var(--cyan);background:rgba(45,226,230,.12)}
.opt.right{border-color:var(--green);background:rgba(124,255,107,.14)}
.opt.wrong{border-color:var(--red);background:rgba(255,77,109,.14)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.05);font-size:14px;white-space:nowrap}
.seg button.on{border-color:var(--cyan);background:rgba(45,226,230,.18)}
.srow.right .seg button.on{border-color:var(--green);background:rgba(124,255,107,.18)}
.srow.wrong .seg button.on{border-color:var(--red);background:rgba(255,77,109,.18)}
.srow .fix{font-size:13px;color:var(--green)}
.olist{display:grid;gap:8px;margin-bottom:14px;counter-reset:o}
.oslot{display:flex;gap:10px;align-items:center;min-height:50px;padding:8px 12px;border-radius:12px;border:2px dashed var(--line)}
.oslot.f{border-style:solid;border-color:var(--cyan);background:rgba(45,226,230,.08)}
.oslot.right{border-color:var(--green)}.oslot.wrong{border-color:var(--red)}
.oslot .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mc);color:#1a0420;font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.07);text-align:left}
.gaptext{font-size:18px;line-height:2.4}
.gaptext select{min-height:44px;border-radius:10px;border:2px solid var(--cyan);background:#1b0838;padding:0 8px;font-size:16px;max-width:100%}
.gaptext select.right{border-color:var(--green)}.gaptext select.wrong{border-color:var(--red)}
.inp{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--cyan);background:rgba(0,0,0,.3);padding:0 14px;font-size:18px}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:18px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;border:2px solid}
.fb.ok{border-color:var(--green);background:rgba(124,255,107,.1)}
.fb.no{border-color:var(--red);background:rgba(255,77,109,.1)}
.fb b{font-family:"Anton",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;font-weight:400;font-size:18px;display:block;margin-bottom:4px}
.fb .sol{margin-top:6px;color:var(--mut);font-size:15px}

/* Ergebnis */
.result{text-align:center;padding:40px 0 50px}
.bigbanner{font-size:clamp(34px,8vw,70px);color:var(--yellow);text-shadow:0 0 24px rgba(255,210,63,.6),0 5px 0 #8a1659;transform:rotate(-3deg);margin:10px 0 6px}
.bigbanner.red{color:var(--red);text-shadow:0 0 24px rgba(255,77,109,.6),0 5px 0 #4a0c24}
.result .stars{font-size:46px}
.result p{max-width:620px;margin:10px auto;color:var(--mut)}
.result .act{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@keyframes pop{0%{transform:scale(.6) rotate(-3deg);opacity:0}70%{transform:scale(1.08) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.bigbanner{animation:pop .5s ease-out both}

/* Handy */
.phone{position:fixed;right:max(2vw,10px);bottom:max(2vw,10px);z-index:40;width:min(340px,92vw);height:min(560px,78svh);border-radius:36px;background:#0d0d14;border:3px solid #444;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(45,226,230,.25);display:flex;flex-direction:column;overflow:hidden}
.phone .bar{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;background:#17172a;border-bottom:1px solid #2a2a40}
.phone .bar svg{width:26px;height:38px}
.phone .bar b{flex:1}.phone .bar button{min-height:40px;min-width:40px;border-radius:12px;border:0;background:#2a2a40}
.phone .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#121226,#0d0d14)}
.sms{max-width:85%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:#2b2b48;font-size:15px}
.sms.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:#1f6f73}
.sms small{display:block;color:#9aa;font-size:11px;margin-bottom:2px}
.phonebtn{position:fixed;right:max(2vw,12px);bottom:max(2vw,12px);z-index:39;width:64px;height:64px;border-radius:20px;border:2px solid var(--cyan);background:#17172a;box-shadow:0 0 22px rgba(45,226,230,.45);display:grid;place-items:center}
.phonebtn svg{width:30px;height:44px}
.phonebtn .dot{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Bericht */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--cyan);font-weight:700}
.code{font-family:"Anton",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;font-size:clamp(18px,4.4vw,30px);letter-spacing:.06em;color:var(--yellow);background:#0d0420;border:2px dashed var(--yellow);border-radius:16px;padding:16px;text-align:center;word-break:break-all;user-select:all}
textarea{width:100%;min-height:90px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.3);padding:10px 12px;font-size:16px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;border:2px solid var(--yellow);background:rgba(255,210,63,.1)}
.badge.off{border-color:var(--line);background:transparent;opacity:.45;filter:grayscale(1)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,3,22,.75);display:grid;place-items:center;padding:20px}
.modal .box{max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:70;background:var(--yellow);color:#1a0420;font-weight:700;padding:10px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .3s}
footer{color:var(--mut);font-size:12px;padding:20px 0 90px;border-top:1px solid var(--line);margin-top:20px}
footer a{color:var(--mut)}
@media (max-width:600px){.srow{grid-template-columns:1fr}.seg{justify-content:flex-start}.hud .rk{display:none}.phone{height:70svh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Start-Tabs & Speichercode */
.tabs{display:flex;gap:6px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.05);font-weight:600}
.tabs button.on{border-color:var(--cyan);background:rgba(45,226,230,.16)}
.codein{font-family:"DM Sans",ui-monospace,monospace!important;letter-spacing:.06em;text-transform:uppercase;flex-basis:100%!important}
.err{color:#ffb3c1;font-weight:600;margin:10px 0 0}
.hintline{font-size:14px;margin:12px 0 0!important}
.savebox{text-align:left;max-width:760px;margin:0 auto 26px;border-color:rgba(255,210,63,.45)}
.modal .savebox{margin:0;border:0;padding:0;background:transparent}
.code{font-family:"DM Sans",ui-monospace,monospace;font-weight:800;font-size:clamp(17px,3.4vw,26px);letter-spacing:.08em;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 2px;font-variant-numeric:tabular-nums;word-break:normal}
.code .grp,.code .pre{white-space:nowrap;background:rgba(255,210,63,.12);border-radius:8px;padding:2px 7px}
.code .pre{background:transparent;padding-right:0}
.code .dash{font-style:normal;opacity:.55}
</style></head>

<script>/* ===== Speichercode: ein Code zum Weiterspielen UND für die Lehrkraft ===== */
const CODEC = (() => {
  const B32 = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";   // ohne 0, 1, I, O
  const VERSION = 2, NU = 6, LEN = 32;
  function stream(n) { const s = []; let x = 0x5EED; for (let k = 0; k < n; k++) { x = (x * 1103515245 + 12345) & 0x7fffffff; s.push((x >> 16) & 1); } return s; }
  function checksum(bits) { let r = 0x2AB; for (const b of bits) { const fb = ((r >> 9) & 1) ^ b; r = (r << 1) & 0x3FF; if (fb) r ^= 0x233; } return r; } // CRC-10
  function encode(units, bossBest, coins) {
    const bits = [];
    const put = (v, n) => { for (let k = n - 1; k >= 0; k--) bits.push((v >> k) & 1); };
    put(VERSION, 2);
    for (let i = 0; i < NU; i++) {
      const u = units[i] || {};
      const has = Array.isArray(u.first);
      let wrong = 0;
      if (has) for (let k = 0; k < 8; k++) if (u.first[k] === false) wrong |= 1 << (7 - k);
      put(u.done ? 1 : 0, 1); put(u.ft ? 1 : 0, 1); put(u.fd ? 1 : 0, 1); put(wrong, 8);
      put(has && u.best !== null && u.best !== undefined ? Math.min(8, u.best) : 15, 4);
      put(Math.max(0, Math.min(7, u.hints || 0)), 3);
      put(Math.max(0, Math.min(4, (u.pbest ?? -1) + 1)), 3);
    }
    put(Math.max(0, Math.min(16383, coins || 0)), 14);
    put(Math.max(0, Math.min(9, (bossBest ?? -1) + 1)), 4);
    const st = stream(bits.length);
    const data = bits.map((b, k) => k < 2 ? b : b ^ st[k]);
    const cs = checksum(data);
    for (let k = 9; k >= 0; k--) data.push((cs >> k) & 1);
    while (data.length < LEN * 5) data.push(0);
    let s = "";
    for (let k = 0; k < data.length; k += 5) s += B32[parseInt(data.slice(k, k + 5).join(""), 2)];
    return "NB-" + s.match(/.{4}/g).join("-");
  }
  function decode(code) {
    const raw = String(code).toUpperCase().replace(/^\s*NB/, "").replace(/[^0-9A-Z]/g, "");
    if (raw.length !== LEN) return { ok: false, err: `Der Code muss nach „NB-“ genau ${LEN} Zeichen haben (gefunden: ${raw.length}).` };
    const bits = [];
    for (const ch of raw) {
      const v = B32.indexOf(ch);
      if (v < 0) return { ok: false, err: "Das Zeichen „" + ch + "“ kommt in Codes nicht vor (es gibt kein 0, O, 1 und I)." };
      for (let k = 4; k >= 0; k--) bits.push((v >> k) & 1);
    }
    const DATA_LEN = 2 + NU * 21 + 14 + 4;
    const data = bits.slice(0, DATA_LEN);
    let cs = 0; for (let k = DATA_LEN; k < DATA_LEN + 10; k++) cs = cs * 2 + bits[k];
    if (cs !== checksum(data)) return { ok: false, err: "Der Code stimmt nicht – bitte jedes Zeichen genau prüfen (z. B. S/5, B/8, Z/2)." };
    const st = stream(DATA_LEN);
    const plain = data.map((b, k) => k < 2 ? b : b ^ st[k]);
    let p = 0;
    const get = n => { let v = 0; for (let k = 0; k < n; k++) v = v * 2 + plain[p++]; return v; };
    if (get(2) !== VERSION) return { ok: false, err: "Dieser Code stammt aus einer älteren Version." };
    const units = [];
    for (let i = 0; i < NU; i++) {
      const u = { done: !!get(1), ft: !!get(1), fd: !!get(1) };
      const mask = get(8), best = get(4), hints = get(3), pb = get(3);
      u.started = u.done || u.ft;
      u.wrong = []; for (let k = 0; k < 8; k++) if (mask & (1 << (7 - k))) u.wrong.push(k);
      u.first = u.started ? [...Array(8).keys()].map(k => !u.wrong.includes(k)) : null;
      u.best = best === 15 ? null : best;
      u.hints = hints; u.pbest = pb - 1; u.profiTried = pb > 0; u.profi = Math.max(0, pb - 1);
      units.push(u);
    }
    const coins = get(14), boss = get(4) - 1;
    return { ok: true, units, coins, boss };
  }
  return { encode, decode, LEN };
})();
</script>

/* ---------- Quiz ---------- */
function play(mode, u) {
  const tasks = mode === "boss" ? DATA.boss : UN[u - 1][mode === "main" ? "main" : mode];
  R = { mode, u, tasks, i: 0, res: [], hints: 0, hinted: {}, checked: false, coins: 0, time: mode === "profi" ? 120 : null, lives: mode === "boss" ? 3 : null, first: mode === "main" && !us(u).first };
  prep(); V = { s: "quiz", u }; render(); window.scrollTo(0, 0);
  if (mode === "profi") startTimer();
  if (mode === "foerder") sms("Willkommen im Trainingslager! 💪 Hier übst du die Grundlagen noch einmal. Nutze ruhig meine Tipps.");
}
function prep() {
  const T = R.tasks[R.i]; R.checked = false; R.ok = null;
  if (T.t === "mc") { R.ord = shuffle(range(T.o.length)); R.ans = null; }
  if (T.t === "multi") { R.ord = shuffle(range(T.o.length)); R.ans = []; }
  if (T.t === "sort") { R.ord = shuffle(range(T.i.length)); R.ans = T.i.map(() => null); }
  if (T.t === "order") { R.ord = shuffle(range(T.i.length)); R.ans = []; }
  if (T.t === "gap") { R.ord = T.g.map(g => shuffle(range(g.length))); R.ans = T.g.map(() => -1); }
  if (T.t === "input") { R.ans = ""; }
}
function ready() {
  const T = R.tasks[R.i];
  if (T.t === "mc") return R.ans !== null;
  if (T.t === "multi") return R.ans.length > 0;
  if (T.t === "sort") return R.ans.every(v => v !== null);
  if (T.t === "order") return R.ans.length === T.i.length;
  if (T.t === "gap") return R.ans.every(v => v >= 0);
  if (T.t === "input") return R.ans.trim().length > 0;
}
const norm = s => s.toLowerCase().replace(/[„“"'.!?]/g, "").replace(/\s+/g, " ").trim().replace(/^(die|der|das) /, "");
function isRight() {
  const T = R.tasks[R.i];
  if (T.t === "mc") return R.ans === T.a;
  if (T.t === "multi") return R.ans.length === T.a.length && T.a.every(k => R.ans.includes(k));
  if (T.t === "sort") return R.ans.every((v, k) => v === T.i[k][1]);
  if (T.t === "order") return R.ans.every((v, k) => v === k);
  if (T.t === "gap") return R.ans.every(v => v === 0);
  if (T.t === "input") { const n = norm(R.ans);
    if (T.acc) return T.acc.includes(n);
    return T.keys.every(g => g.some(k => n.includes(k))) && !(T.bad || []).some(b => n.includes(b)); }
}
function check() {
  if (R.checked || !ready()) return;
  R.checked = true; R.ok = isRight(); R.res.push(R.ok);
  const pts = { main: R.first ? 10 : 3, foerder: 5, profi: 15, boss: 10 }[R.mode];
  if (R.ok) addCoins(pts);
  if (R.mode === "boss" && !R.ok) R.lives--;
  save(); render();
  const fb = $("#fb"); if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function next() {
  if (R.mode === "boss" && R.lives <= 0) return finish(true);
  R.i++;
  if (R.i >= R.tasks.length) return finish();
  prep(); render(); window.scrollTo(0, 0);
}
function hint() {
  const T = R.tasks[R.i];
  if (!R.hinted[R.i]) { R.hinted[R.i] = true; R.hints++; }
  sms("💡 " + esc(T.h)); openPhone(true);
}
function startTimer() {
  stopTimer();
  TIMER = setInterval(() => {
    if (!R || R.mode !== "profi") return stopTimer();
    R.time--;
    const el = $("#timer"); if (el) { el.textContent = "⏱ " + R.time + " s"; el.classList.toggle("low", R.time <= 20); }
    if (R.time <= 0) { stopTimer(); while (R.res.length < R.tasks.length) R.res.push(false); toast("⏰ Zeit abgelaufen!"); finish(); }
  }, 1000);
}
function stopTimer() { if (TIMER) { clearInterval(TIMER); TIMER = null; } }

  return `<div class="wrap" style="--mc:${mc}">
    <div class="qtop"><span class="mode">${modeName}</span><div class="prog">${prog}</div>${extra}<span class="pill">Aufgabe ${R.i + 1}/${R.tasks.length}</span></div>
    <div class="qcard"><h2>${esc(T.q)}</h2>${body}${fb}<div class="qfoot">${foot}</div></div>
    <p class="lockinfo" style="margin-top:14px"><button class="btn ghost" data-a="abort">✖ Abbrechen</button></p></div>`;
}

/* ---------- Auswertung ---------- */
let LAST = null;
function finish(dead) {
  stopTimer();
  const correct = R.res.filter(Boolean).length, wrong = R.tasks.length - correct, U = R.u ? UN[R.u - 1] : null;
  LAST = { mode: R.mode, u: R.u, correct, n: R.tasks.length, coins: R.coins, dead: !!dead };
  if (R.mode === "main") {
    const st = us(R.u);
    if (!st.first) st.first = R.res.slice();
    st.hints += R.hints;
    st.best = st.best === null ? wrong : Math.min(st.best, wrong);
    if (wrong >= 3 && !st.done) { st.ft = true; LAST.training = true;
      sms(`Mission ${R.u}: ${correct}/8 richtig. Kein Problem – im Trainingslager machst du dich fit! 🏋️`); }
    else { const was = st.done; st.done = true; LAST.passed = true;
      if (!was) sms(`Mission ${R.u} geschafft! 🎉 ${R.u < 6 ? "Die nächste Mission ist freigeschaltet." : "Das Finale in den Sunset Hills wartet!"}`);
      if (wrong <= 2 && !LAST.dead) LAST.profi = true; }
  }
  if (R.mode === "foerder") {
    const st = us(R.u); st.hints += R.hints; st.fbest = Math.max(st.fbest, correct); if (correct >= 3) st.fd = true; st.done = true;
  }
  if (R.mode === "profi") {
    const st = us(R.u), bonus = correct ? Math.max(0, Math.floor(R.time / 3)) : 0;
    addCoins(bonus); LAST.bonus = bonus; LAST.coins = R.coins;
    const before = st.pbest; st.pbest = Math.max(st.pbest, correct);
    if (correct >= 2 && before < 2) sms(`Abzeichen freigeschaltet: ${U.badge.icon} ${esc(U.badge.name)}! 😎`);
  }
  if (R.mode === "boss" && !dead) S.boss.best = Math.max(S.boss.best, correct);
  save();
  if (R.mode !== "boss" || !dead) sms("💾 Neuer Speichercode! Schreib ihn in dein Heft – damit geht nichts verloren.");
  go("result", R.u);
}
function resultView() {
  const L = LAST, U = L.u ? UN[L.u - 1] : null;
  let big = "MISSION GESCHAFFT", red = false, txt = "", acts = "";
  if (L.mode === "main") {
    if (L.training) { big = "TRAININGSLAGER"; red = true;
      txt = `Du hast ${L.correct} von 8 Aufgaben richtig – das sind mehr als 30 % Fehler. Kein Drama: Im Trainingslager übst du die Grundlagen mit Extra-Aufgaben. Danach ist die Mission geschafft.`;
      acts = `<button class="btn cyan" data-a="play" data-m="foerder" data-u="${L.u}">🏋️ Ab ins Trainingslager</button><button class="btn ghost" data-a="brief" data-u="${L.u}">Zum Briefing</button>`; }
    else { txt = `${L.correct} von 8 richtig · +${L.coins} 🪙`;
      acts = (L.profi ? `<button class="btn gold" data-a="play" data-m="profi" data-u="${L.u}">🔥 Profi-Mission freigeschaltet!</button>` : "") + `<button class="btn" data-a="map">🗺️ Zur Karte</button>`;
      if (!L.profi) txt += " · Für die Profi-Mission brauchst du höchstens 2 Fehler – versuch's nochmal!"; }
  }
  if (L.mode === "foerder") { big = L.correct >= 3 ? "TRAINING BESTANDEN" : "TRAINING BEENDET"; red = L.correct < 3;
    txt = `${L.correct} von ${L.n} richtig. ${L.correct >= 3 ? "Die Mission ist geschafft – weiter geht's!" : "Die Mission zählt als geschafft. Übe die Aufgaben ruhig noch einmal oder frag deine Lehrkraft."}`;
    acts = `${L.correct < 3 ? `<button class="btn cyan" data-a="play" data-m="foerder" data-u="${L.u}">🔁 Nochmal trainieren</button>` : ""}<button class="btn ghost" data-a="play" data-m="main" data-u="${L.u}">🔁 Mission nochmal spielen</button><button class="btn" data-a="map">🗺️ Zur Karte</button>`; }
  if (L.mode === "profi") { big = L.correct === 3 ? "LEGENDÄR!" : L.correct >= 2 ? "PROFI-MISSION GESCHAFFT" : "KNAPP VORBEI"; red = L.correct < 2;
    txt = `${L.correct} von 3 richtig · Zeitbonus +${L.bonus} 🪙 · ${L.correct >= 2 ? `Abzeichen: ${U.badge.icon} ${esc(U.badge.name)}` : "Für das Abzeichen brauchst du 2 von 3."}`;
    acts = `<button class="btn gold" data-a="play" data-m="profi" data-u="${L.u}">🔁 Nochmal</button><button class="btn" data-a="map">🗺️ Zur Karte</button>`; }
  if (L.mode === "boss") { if (L.dead) { big = "GAME OVER"; red = true; txt = "Alle Leben verbraucht – aber ein echter Profi steht wieder auf!";
      acts = `<button class="btn gold" data-a="play" data-m="boss">⚔️ Nochmal</button><button class="btn ghost" data-a="finale">Zurück</button>`; }
    else { big = L.correct >= 7 ? "LEGENDE VON NEON BAY" : "BOSS BESIEGT"; txt = `${L.correct} von 8 richtig · +${L.coins} 🪙. Jetzt fehlt nur noch deine eigene Erörterung – und dein Code für die Lehrkraft.`;
      acts = `<button class="btn cyan" data-a="report">📋 Bericht &amp; Code</button><button class="btn ghost" data-a="map">🗺️ Karte</button>`; } }
  const stars = L.mode === "main" && !L.training ? `<div class="stars">${starStr(starsOf(L.u))}</div>` : "";
  return `<div class="wrap"><div class="result"><div class="bigbanner disp ${red ? "red" : ""}">${big}</div>${stars}<p>${txt}</p><div class="act">${acts}</div></div>
    ${codeBox("Dein neuer Speichercode", "Schreib ihn jetzt in dein Heft (unter das Datum). Damit kannst du auf jedem Gerät weiterspielen – und deine Lehrkraft sieht, wo du stehst.")}</div>`;
}

/* ---------- Bericht & Code ---------- */
function reportView() {
  const rows = UN.map(U => { const st = us(U.id);
    const weak = st.first ? st.first.map((ok, k) => ok ? null : U.main[k].skill).filter(Boolean) : [];
    return `<tr><td><b>${U.icon} ${esc(U.title)}</b></td><td>${st.done ? "✅ geschafft" : st.first ? "🏋️ Trainingslager offen" : "–"}</td>
      <td class="stars">${starStr(starsOf(U.id))}</td><td>${st.first ? st.first.filter(Boolean).length + "/8" : "–"}</td>
      <td>${weak.length ? weak.map(esc).join(", ") : st.first ? "alles sicher 💪" : ""}</td></tr>`; }).join("");
  const badges = UN.map(U => `<span class="badge ${us(U.id).pbest >= 2 ? "" : "off"}">${U.badge.icon} ${esc(U.badge.name)}</span>`).join("");
  return `<div class="wrap" style="padding-bottom:20px">
    <h1 class="disp" style="font-size:clamp(28px,5vw,44px);color:var(--yellow);margin:22px 0 6px">Missionsbericht</h1>
    <p style="color:var(--mut);margin-top:0">${esc(S.name)} · ${rank()} · 🪙 ${S.coins} · ⭐ ${totalStars()}/21</p>
    ${codeBox("Dein Code", "Ein Code für alles: Zeig ihn deiner Lehrkraft – sie sieht daran, wo du sicher bist und wo du noch Hilfe brauchst. Und mit demselben Code spielst du auf jedem Gerät weiter.")}
    <div class="panel" style="margin-bottom:16px;overflow-x:auto"><h3 class="disp">Deine Missionen</h3>
      <table class="stack"><thead><tr><th>Mission</th><th>Status</th><th>Sterne</th><th>1. Versuch</th><th>Daran arbeitest du noch</th></tr></thead><tbody>${rows}</tbody></table>
      <p style="font-size:14px;color:var(--mut)">Boss-Fight: ${S.boss.best >= 0 ? S.boss.best + "/8" : "noch nicht gespielt"}</p></div>
    <div class="panel" style="margin-bottom:16px"><h3 class="disp">Deine Abzeichen</h3><div class="badges">${badges}</div></div>
    <div class="grid2"><div class="panel"><h3 class="disp">Das kann ich jetzt richtig gut</h3><textarea data-refl="a" placeholder="z. B. Argumente mit Begründung und Beispiel bauen">${esc(S.refl.a)}</textarea></div>
      <div class="panel"><h3 class="disp">Hier brauche ich noch Hilfe</h3><textarea data-refl="b" placeholder="z. B. die Sanduhr-Reihenfolge">${esc(S.refl.b)}</textarea></div></div>
    <div class="panel" style="margin-top:16px"><h3 class="disp">Spielstand aus Code laden</h3>
      <p style="margin-top:0">Neues Gerät oder Spielstand verschwunden? Gib hier einen Speichercode ein. Achtung: Der aktuelle Spielstand wird dabei ersetzt.</p>
      <form class="field" id="restoreform" style="justify-content:flex-start"><label class="hidden" for="sc2">Speichercode</label>
        <input id="sc2" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NB-XXXX-XXXX-…">
        <button class="btn cyan" type="submit">Laden</button></form><p id="reserr" class="err hidden" role="alert"></p></div>
    <div class="actions"><button class="btn" data-a="map">🗺️ Zur Karte</button><button class="btn ghost" data-a="reset">🗑 Spielstand löschen</button></div></div>`;
}
function modal(html) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(m); return m; }

/* ---------- Ereignisse ---------- */
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "startform") {
    e.preventDefault();
    const n = $("#nm").value.trim(); if (!n) { $("#nm").focus(); return; }
    if (f.dataset.mode === "restore") {
      const err = restoreFrom($("#sc").value, n);
      if (err) { const p = $("#starterr"); p.textContent = "⚠ " + err; p.classList.remove("hidden"); $("#sc").focus(); return; }
      return go("map");
    }
    const isNew = !S.name; S.name = n.slice(0, 24); save();
    if (isNew) sms(`Hey ${esc(S.name)}! 👋 Ich bin Phoni, dein Handy. Willkommen in Neon Bay! Starte mit Mission 1 in Downtown. Wenn du nicht weiterkommst, tipp auf „Tipp von Phoni“ – ich schicke dir einen Hinweis.`);
    return go("map");
  }
  if (f.id === "restoreform") {
    e.preventDefault();
    const err = restoreFrom($("#sc2").value, S.name || "Spieler");
    if (err) { const p = $("#reserr"); p.textContent = "⚠ " + err; p.classList.remove("hidden"); return; }
    toast("✔ Spielstand geladen"); return go("map");
  }
});
function act(a, d) {
  if (a === "map") return go("map");
  if (a === "starttab") return renderStart(d.t);
  if (a === "savecode") { modal(`${codeBox("Dein Speichercode", "Schreib ihn in dein Heft. Damit spielst du jederzeit auf jedem Gerät weiter.")}
      <div class="actions" style="margin:12px 0 0"><button class="btn ghost" data-a="close">Schließen</button></div>`); return; }
  if (a === "report") return go("report");
  if (a === "finale") return go("finale");
  if (a === "brief") { const u = +d.u; if (!unlocked(u)) return toast("🔒 Erst die vorherige Mission schaffen!"); return go("brief", u); }
  if (a === "play") { const u = +(d.u || V.u); if (d.m === "profi" && !profiOpen(u)) return; return play(d.m, u); }
  if (a === "pick") { const T = R.tasks[R.i], k = +d.k; if (T.t === "mc") R.ans = k; else R.ans = R.ans.includes(k) ? R.ans.filter(x => x !== k) : [...R.ans, k]; return render(); }
  if (a === "sort") { R.ans[+d.k] = +d.c; return render(); }
  if (a === "ord") { R.ans.push(+d.k); return render(); }
  if (a === "ordundo") { R.ans.pop(); return render(); }
  if (a === "ordreset") { R.ans = []; return render(); }
  if (a === "check") return check();
  if (a === "next") return next();
  if (a === "hint") { hint(); return render(); }
  if (a === "abort") { const m = modal(`<h3 class="disp" style="color:var(--yellow)">Mission abbrechen?</h3><p>Dein Fortschritt in dieser Runde geht verloren.</p>
      <div class="actions" style="margin:10px 0 0"><button class="btn" data-a="abortyes">Ja, abbrechen</button><button class="btn ghost" data-a="close">Weiterspielen</button></div>`); return; }
  if (a === "abortyes") { document.querySelector(".modal")?.remove(); const u = R.u; R = null; return u ? go("brief", u) : go("finale"); }
  if (a === "close") { document.querySelector(".modal")?.remove(); return; }
  if (a === "phone") return openPhone($("#phone").classList.contains("hidden"));
  if (a === "copy") { const c = (document.querySelector(".modal #code") || $("#code")).textContent;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.querySelector(".modal #code") || $("#code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Code markiert – jetzt kopieren"); };
    try { navigator.clipboard.writeText(c).then(() => toast("✔ Code kopiert"), fallback); } catch (e) { fallback(); } return; }
  if (a === "reset") { modal(`<h3 class="disp" style="color:var(--red)">Alles löschen?</h3><p>Name, Coins, Sterne und alle Ergebnisse werden auf diesem Gerät gelöscht. Das kann man nicht rückgängig machen.</p>
      <div class="actions" style="margin:10px 0 0"><button class="btn" data-a="resetyes">Ja, löschen</button><button class="btn ghost" data-a="close">Abbrechen</button></div>`); return; }
  if (a === "resetyes") { document.querySelector(".modal")?.remove(); S = fresh(); save(); renderPhone(); return go("start"); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("mk")) { e.preventDefault(); act(e.target.dataset.a, e.target.dataset); }
  if (e.key === "Enter" && e.target.id === "inp") { e.preventDefault(); check(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "inp" && R) { R.ans = e.target.value; const b = $("#checkbtn"); if (b) b.disabled = !ready(); }
  if (e.target.dataset && e.target.dataset.refl) { S.refl[e.target.dataset.refl] = e.target.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.gap !== undefined && R) { R.ans[+t.dataset.gap] = +t.value; const b = $("#checkbtn"); if (b) b.disabled = !ready(); }
  if (t.dataset.mat) { us(V.u).mat[t.dataset.mat] = t.checked; save(); if (t.checked) toast("✔ Abgehakt – stark!"); }
});

renderPhone(); render();
window.__NB = { get S() { return S; }, get R() { return R; }, act, play, check, next, render, go };
}
</script>
</body></html>
